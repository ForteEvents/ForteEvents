name: E-card Studio validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/ecard-studio-polish]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Run existing automated tests
        run: npm test
