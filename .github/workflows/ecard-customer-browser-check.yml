name: E-card customer browser check

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'ForteEvents web URL to test'
        required: true
        default: 'https://forteevents-web.onrender.com'

permissions:
  contents: read

jobs:
  ecard-customer-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install app dependencies
        run: npm ci
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run test-customer E-card flow
        env:
          FORTE_BASE_URL: ${{ inputs.base_url }}
          FORTE_TEST_EMAIL: ${{ secrets.FORTE_TEST_EMAIL }}
          FORTE_TEST_PASSWORD: ${{ secrets.FORTE_TEST_PASSWORD }}
        run: node .github/scripts/ecard-customer-check.mjs
      - name: Upload screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forteevents-ecard-browser-check
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
