name: E-Card build check
# Re-run the build after the local QR generation update.

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/ecard-wedding-template-v2]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Build frontend
        run: npm run build
