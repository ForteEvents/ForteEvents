name: ForteEvents build
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check backend JavaScript syntax
        run: |
          node --check server/server.js
          node --check server/ecard-distribution.js
          node --check server/whatsapp-service.js
